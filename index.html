<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Rocky ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#0f0f1e;overflow-x:hidden;color:white}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
.bg{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 30%, #ff006a33 0%, transparent 50%), radial-gradient(circle at 80% 70%, #a855f733 0%, transparent 50%);z-index:1}
.container{position:relative;z-index:2;max-width:500px;margin:0 auto;padding:20px}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero h1{font-family:'Great Vibes',cursive;font-size:5rem;background:linear-gradient(90deg,#ff6b9d,#ffa6c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px #ff6b9d)}
.card{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.15);border-radius:28px;padding:30px;margin:20px 0;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.typewriter{line-height:1.9;min-height:180px}
.btn{width:100%;padding:18px;border-radius:50px;border:none;font-weight:600;font-size:1rem;cursor:pointer;margin:10px 0;display:flex;justify-content:center;gap:10px}
.btn-p{background:linear-gradient(135deg,#ff006a,#ff4081);color:white;box-shadow:0 10px 30px rgba(255,0,106,0.4)}
.btn-o{background:transparent;border:2px solid #ff6b9d;color:#ff6b9d}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
.hf{position:absolute;animation:floatUp linear forwards}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0deg);opacity:1}100%{transform:translateY(-10vh) rotate(720deg);opacity:0}}
.counter{display:flex;justify-content:space-around;text-align:center;margin:20px 0}
.counter h3{font-size:2rem;color:#ff6b9d}
.envelope{width:120px;height:80px;background:#ff6b9d;margin:20px auto;position:relative;border-radius:8px;cursor:pointer}
.envelope:before{content:'';position:absolute;top:0;left:0;border-left:60px solid transparent;border-right:60px solid transparent;border-top:40px solid #ff4081;transform-origin:top;transition:0.5s}
.envelope.open:before{transform:rotateX(180deg)}
.letter{position:absolute;top:5px;left:10px;right:10px;height:70px;background:white;border-radius:6px;color:#333;padding:10px;font-size:0.7rem;text-align:center;transition:0.5s;z-index:1}
.envelope.open .letter{transform:translateY(-60px);height:110px}
.music-btn{position:fixed;bottom:25px;right:25px;z-index:99;background:linear-gradient(135deg,#ff006a,#ff4081);width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 25px rgba(255,0,106,0.6);font-size:24px;animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
</style>
</head>
<body>
<canvas id="particles"></canvas><div class="bg"></div><div class="hearts" id="hearts"></div>
<div class="hero"><h1>Rocky</h1><p style="letter-spacing:3px;opacity:0.6;margin-top:10px">INI SEMUA TENTANG KAMU</p><p style="margin-top:20px;animation:pulse 1.5s infinite">💜<br>↓ scroll ↓</p></div>
<div class="container">
<div class="card"><h2 style="font-family:'Great Vibes',cursive;font-size:2.5rem;text-align:center;color:#ffa6c9;margin-bottom:15px">Hai Sayangku...</h2><div class="typewriter" id="typewriter
